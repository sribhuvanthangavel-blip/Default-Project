# Supabase CLI configuration (local development only).
# Remote project settings — Auth URLs, SMTP, backups — are configured in the
# Supabase dashboard and documented in docs/DEPLOYMENT.md.

project_id = "jishnus-dentistry"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[auth.email.smtp]
# Local Mailpit. Production uses the clinic's SMTP provider (see docs).
enabled = false

[storage]
enabled = false
